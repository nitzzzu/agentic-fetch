# Global DOM strip (applied before html→markdown conversion)
strip_selectors:
  - nav
  - footer
  - aside
  - header
  - .cookie-banner
  - "#cookie-consent"
  - .ad
  - .advertisement
  - "[class*='popup']"
  - "[id*='modal']"

# Global line strip (regex, applied to markdown output after conversion)
strip_lines:
  - "^\\s*Share (this|on)"
  - "^\\s*Subscribe"
  - "^\\s*Follow us"
  - "^\\s*Newsletter"
  - "^\\s*ADVERTISEMENT"
  - "\\[Read (more|also)\\]"
  - "^\\s*Ad Feedback\\s*$"
  - "^\\s*(Facebook|Tweet|Email|Link|Threads)\\s*$"
  - "^\\s*Link Copied!\\s*$"
  - "^\\s*Scan the QR code"
  - "^\\s*Follow\\s*$"

# Per-domain overrides. The `init_script` key here replaces the deprecated
# top-level `init_scripts:` map (both still load, but use this single path).
domains:
  wsj.com:
    init_script: |
      Object.defineProperty(document, 'cookie', { get: () => 'subscriber=true' });

  ft.com:
    init_script: |
      window.__FT_BARRIER_DISABLED = true;

  # NOTE: Medium-family domains are handled by the `medium` plugin via Freedium.
  # Putting proxy_url here would never fire — the plugin tier short-circuits first.

  digi24.ro:
    strip_selectors:
      - .widget-cross
      - .widget-news
      - .ad-wrapper
      - .ad-native
      - .social
      - .tags-list
      - .read-more
      - .read-more-alt
      - .section
    strip_lines:
      - "Citește și:"

  github.com:
    strip_selectors:
      - .Layout-sidebar
      - .js-header-wrapper
      - .footer
